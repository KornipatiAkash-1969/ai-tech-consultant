<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <linearGradient id="aBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12" />
      <stop offset="100%" stop-color="#0e1324" />
    </linearGradient>
    <linearGradient id="aCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14192b" />
      <stop offset="100%" stop-color="#0b0e1a" />
    </linearGradient>
  </defs>

  <rect width="940" height="260" rx="12" fill="url(#aBg)" stroke="#1e263d" stroke-width="1.5" />
  
  <text x="30" y="34" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="15">TASK 2: AUTONOMY ENGINE STATE MACHINE &amp; DIFF LEARNER</text>
  <text x="30" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">20 Consecutive Approvals Rule • Category Scoped • Instant Regression Rollback</text>

  <!-- State 1: Human Supervised -->
  <g transform="translate(40, 75)">
    <rect width="240" height="150" rx="8" fill="url(#aCard)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="240" height="3" fill="#38bdf8" />
    <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">STATE 1: SUPERVISED</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="13">Human Review Gate</text>
    <text x="16" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• Inbound customer email</text>
    <text x="16" y="88" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• AI drafts grounded reply</text>
    <text x="16" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• Human reviews draft</text>
    <text x="16" y="124" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Streak counter: 0 to 19</text>
  </g>

  <!-- Transition: Unedited Approval -->
  <path d="M 285 110 L 375 110" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />
  <text x="330" y="102" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">+1 Approval (Unedited)</text>

  <!-- State 2: Diff Learning -->
  <g transform="translate(380, 75)">
    <rect width="210" height="150" rx="8" fill="url(#aCard)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="3" fill="#f59e0b" />
    <text x="16" y="26" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">FEEDBACK: DIFF LEARNER</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="13">Human Edits Draft</text>
    <text x="16" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• Semantic diff extracted</text>
    <text x="16" y="88" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• Undoable rule saved</text>
    <text x="16" y="106" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9.5">• Streak reset to 0</text>
    <text x="16" y="124" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• Applied to future drafts</text>
  </g>

  <!-- Transition: 20 approvals reached -->
  <path d="M 595 110 L 685 110" stroke="#10b981" stroke-width="2" />
  <text x="640" y="102" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Hit 20/20 Threshold</text>

  <!-- State 3: Fully Autonomous -->
  <g transform="translate(690, 75)">
    <rect width="210" height="150" rx="8" fill="url(#aCard)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="3" fill="#10b981" />
    <text x="16" y="26" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">STATE 2: AUTONOMOUS</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-weight="700" font-size="13">Instant Auto-Dispatch</text>
    <text x="16" y="70" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5">• ⚡ Zero human delay</text>
    <text x="16" y="88" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Category-isolated safety</text>
    <text x="16" y="106" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">• Dispatched &amp; logged</text>
    <text x="16" y="124" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">• Continuous audit mode</text>
  </g>

  <!-- Rollback arrow from Autonomous back to Supervised -->
  <path d="M 795 230 L 795 245 L 160 245 L 160 230" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
  <text x="480" y="240" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">Safety Regression Triggered: Immediate Rollback to Supervised &amp; Streak ➔ 0</text>
</svg>
